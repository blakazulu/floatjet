# FloatJet - Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Affiliate link redirects
# Note: Update these with actual affiliate URLs once approved

